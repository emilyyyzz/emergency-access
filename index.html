<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@300;400&display=swap');

:root {
  --bg: #0a0a0b;
  --surface: #111114;
  --border: #1e1e24;
  --text: #e8e4dd;
  --muted: #52525e;
  --red: #d94f3d;
  --green: #3a7d55;
  --green-text: #6dba7e;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 20px 64px;
}

body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:999;
}

header {
  text-align: center;
  margin-bottom: 48px;
}

.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 10px;
}

h1 {
  font-size: clamp(30px, 7vw, 44px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

h1 em {
  font-style: normal;
  color: var(--muted);
  font-weight: 400;
}

.subtitle {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-top: 14px;
  line-height: 1.8;
}

.screen { display: none; width: 100%; max-width: 460px; }
.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── WHO'S THERE ── */
.whos-there-q {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin-bottom: 4px;
}

.user-btns {
  display: flex;
  gap: 12px;
  width: 100%;
}

.user-btn {
  flex: 1;
  padding: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.user-btn span {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}
.user-btn:hover {
  border-color: var(--red);
  background: rgba(217,79,61,0.05);
}

/* ── STATUS ── */
.status-msg {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  letter-spacing: 0.08em;
  padding: 32px 0;
  width: 100%;
}
.status-msg.error { color: var(--red); }

/* ── EXCUSE ── */
.excuse-wrap { width: 100%; }

.field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}

.excuse-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  outline: none;
  resize: none;
  transition: border-color 0.15s;
  line-height: 1.5;
}
.excuse-input::placeholder { color: var(--muted); font-style: italic; }
.excuse-input:focus { border-color: #3a3a46; }
.excuse-input.invalid { border-color: var(--red); }

.field-error {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--red);
  margin-top: 6px;
  letter-spacing: 0.06em;
  display: none;
}
.field-error.show { display: block; }

/* ── CARDS ── */
.cards {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.card-body {
  padding: 28px 22px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}

.card-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red);
  text-shadow:
    0 0 6px rgba(217,79,61,0.95),
    0 0 16px rgba(217,79,61,0.6),
    0 0 36px rgba(217,79,61,0.3);
  position: relative;
  z-index: 2;
}

.card-pw {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: var(--text);
  line-height: 1;
  min-height: 26px;
  text-align: center;
  word-break: break-all;
}

.copy-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
  min-height: 34px;
}
.copy-area.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: all;
}

.copy-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 16px;
  border: 1px solid #282830;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.copy-btn:hover { border-color: #3a3a46; color: var(--text); }
.copy-btn.ok { border-color: #2a5c35; color: var(--green-text); }

.copy-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.06em;
}

/* ── UPDATE PASSWORDS BUTTON ── */
.update-toggle {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  margin-top: 4px;
}
.update-toggle:hover { border-color: #3a3a46; color: var(--text); }

/* ── EDITOR ── */
.editor-wrap {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.editor-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.editor-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.editor-section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--red);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.pw-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.pw-row-label {
  flex: 0.9;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 12px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}
.pw-row-label:focus { border-color: #3a3a46; }

.pw-row-value {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 12px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}
.pw-row-value:focus { border-color: #3a3a46; }

.pw-row-del {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  padding: 9px 11px;
  cursor: pointer;
  font-size: 13px;
  transition: border-color 0.15s, color 0.15s;
  flex-shrink: 0;
}
.pw-row-del:hover { border-color: var(--red); color: var(--red); }

.add-row-btn {
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 7px;
  color: var(--muted);
  padding: 9px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  width: 100%;
}
.add-row-btn:hover { border-color: #3a3a46; color: var(--text); }

.editor-actions {
  display: flex;
  gap: 10px;
}

.save-btn {
  flex: 1;
  padding: 12px;
  background: var(--green);
  border: none;
  border-radius: 8px;
  color: white;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
}
.save-btn:hover { opacity: 0.85; }
.save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.cancel-btn {
  padding: 12px 18px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;

.cancel-btn:hover { border-color: #3a3a46; color: var(--text); }

  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  text-align: center;
  letter-spacing: 0.08em;
  color: var(--muted);
  min-height: 16px;

.save-status.ok    { color: var(--green-text); }

/* ── GLASS ── */
.glass {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  cursor: pointer;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.glass-frost {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(210,230,255,0.11) 0%, rgba(160,190,255,0.04) 100%);
  backdrop-filter: blur(7px) brightness(1.04) saturate(1.1);
  -webkit-backdrop-filter: blur(7px) brightness(1.04) saturate(1.1);
  transition: backdrop-filter 0.25s ease;
}
.glass-frost::after {
  content:'';
  position:absolute;
  inset:0;
  border-radius:14px;
  background: linear-gradient(118deg, rgba(255,255,255,0.09) 0%, transparent 55%);
  pointer-events:none;
}

.glass[data-cracks="1"] .glass-frost { backdrop-filter: blur(5px) brightness(1.03); -webkit-backdrop-filter: blur(5px); }
.glass[data-cracks="2"] .glass-frost { backdrop-filter: blur(3px) brightness(1.02); -webkit-backdrop-filter: blur(3px); }
.glass[data-cracks="3"] .glass-frost { backdrop-filter: blur(1.5px) brightness(1.01); -webkit-backdrop-filter: blur(1.5px); }
.glass[data-cracks="4"] .glass-frost { backdrop-filter: blur(0.4px) brightness(1.0); -webkit-backdrop-filter: blur(0.4px); }

.glass-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

@keyframes glassHit {
  0%   { background: rgba(255,255,255,0.13); }
  100% { background: transparent; }
}
.glass.hitting { animation: glassHit 0.16s ease-out; }

@keyframes glassShatter {
  0%   { opacity:1; transform:scale(1); filter:brightness(1.5); }
  35%  { opacity:0.55; transform:scale(1.02); }
  100% { opacity:0; transform:scale(1.05); }
}
.glass.shattering {
  animation: glassShatter 0.42s cubic-bezier(0.4,0,0.2,1) forwards;
  pointer-events: none;
}

footer {
  margin-top: 52px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  letter-spacing: 0.1em;
  line-height: 1.9;
  opacity: 0.5;
}

// ── USER SELECTION ───────────────────────────────────────
async function selectUser(user) {
  currentUser = user;
  const cfg = CONFIG[user];
  document.getElementById('subtitle').textContent =
    `${cfg.notifyName} will be notified if any glass is broken.`;
  goTo('screen-main');

async function loadPasswords() {
  const loadingMsg = document.getElementById('loading-msg');
  const cardsEl    = document.getElementById('cards');
  const toggleBtn  = document.getElementById('update-toggle-btn');

  loadingMsg.textContent  = 'fetching passwords…';
  loadingMsg.className    = 'status-msg';
  loadingMsg.style.display = 'block';
  cardsEl.style.display    = 'none';
  toggleBtn.style.display  = 'none';

  try {
    const res  = await fetch(GIST_RAW_URL + '?t=' + Date.now());
    gistData   = await res.json();
    const passwords = gistData[currentUser];

    if (!passwords || passwords.length === 0) throw new Error('empty');

    loadingMsg.style.display = 'none';
    cardsEl.style.display    = 'flex';
    toggleBtn.style.display  = 'block';
    buildCards(passwords);
  } catch {
    loadingMsg.textContent = '⚠ could not load passwords — check Gist URL';
    loadingMsg.className   = 'status-msg error';
  }
}

// ── EXCUSE VALIDATION ────────────────────────────────────
function requireExcuse() {
  const val   = document.getElementById('excuse').value.trim();
  const errEl = document.getElementById('excuse-error');
  const input = document.getElementById('excuse');
  if (!val) {
    input.classList.add('invalid');
    errEl.classList.add('show');
    input.focus();
    return false;
  }
  input.classList.remove('invalid');
  errEl.classList.remove('show');
  return true;
}

document.getElementById('excuse').addEventListener('input', function() {
  if (this.value.trim()) {
    this.classList.remove('invalid');
    document.getElementById('excuse-error').classList.remove('show');
  }
});

  const content = `<pre style="font-family:monospace;font-size:13px;line-height:1.4;background:#000;color:#ff3b2f;padding:24px;border-radius:8px;">${cfg.ascii}

T H E   G L A S S   H A S   B E E N   S H A T T E R E D

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Device  :  ${label}
  Time    :  ${timestamp}
  Excuse  :  ${excuse}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

${currentUser === 'brian' ? 'Brian' : 'Emily'} accessed the emergency passwords.</pre>`;
  return { subject, content };
}

function notify(label) {
  const cfg       = CONFIG[currentUser];
  const excuse    = document.getElementById('excuse').value.trim();
  const timestamp = new Date().toLocaleString();
  const { subject, content } = buildEmailContent(cfg, label, excuse, timestamp);
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: cfg.notifyEmail,
    subject,
    content,
  }).catch(() => {});
}

// ── PIN + EDITOR ─────────────────────────────────────────

function openEditor() {
  if (!gistData) return;
  const other = currentUser === 'brian' ? 'emily' : 'brian';
  const otherName = other.charAt(0).toUpperCase() + other.slice(1);
  document.getElementById('editor-section-label').textContent = otherName + "'s passwords";
  populateEditorSection('other', gistData[other] || []);
  document.getElementById('editor-wrap').style.display = 'flex';
  document.getElementById('save-status').textContent   = '';
  document.getElementById('save-status').className     = 'save-status';
}

function populateEditorSection(containerId, passwords) {
  const container = document.getElementById('editor-' + containerId);
  container.innerHTML = '';
  passwords.forEach(pw => addEditorRow(containerId, pw.label, pw.value));
}

function addEditorRow(containerId, label = '', value = '') {
  const container = document.getElementById('editor-' + containerId);
  const row = document.createElement('div');
  row.className = 'pw-row';
  row.innerHTML = `
    <input class="pw-row-label" type="text" placeholder="Label" value="${label.replace(/"/g,'&quot;')}" />
    <input class="pw-row-value" type="text" placeholder="Password" value="${value.replace(/"/g,'&quot;')}" />
    <button class="pw-row-del" onclick="this.closest('.pw-row').remove()">✕</button>`;
  container.appendChild(row);
}

function getEditorRows(containerId) {
  return Array.from(document.querySelectorAll(`#editor-${containerId} .pw-row`)).map(row => {
    const inputs = row.querySelectorAll('input');
    return { label: inputs[0].value.trim(), value: inputs[1].value.trim() };
  }).filter(r => r.label || r.value);
}

async function saveToGist() {
  const btn      = document.getElementById('save-btn');
  const statusEl = document.getElementById('save-status');
  btn.disabled   = true;
  statusEl.textContent = 'saving…';
  statusEl.className   = 'save-status';

  const other = currentUser === 'brian' ? 'emily' : 'brian';

  const newData = {
    ...gistData,
    [other]: getEditorRows('other'),
  };

  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `Bearer ${GITHUB_TOKEN}`,
        'Content-Type':  'application/json',
        'Accept':        'application/vnd.github+json',
      },
      body: JSON.stringify({
        files: {
          'passwords.json': {
            content: JSON.stringify(newData, null, 2),
          },
        },
      }),
    });

    if (!res.ok) throw new Error('GitHub API error ' + res.status);

    gistData = newData;
    statusEl.textContent = '✓ saved successfully';
    statusEl.className   = 'save-status ok';

  } catch {
    statusEl.textContent = '⚠ save failed — check token';
    statusEl.className   = 'save-status error';
  } finally {
    btn.disabled = false;
  }
}

function closeEditor() {
  document.getElementById('editor-wrap').style.display       = 'none';
  document.getElementById('update-toggle-btn').style.display = 'block';
}

// ── CRACK GENERATOR ──────────────────────────────────────
function rng(seed) {
  const x = Math.sin(seed + 1) * 43758.5453123;
  return x - Math.floor(x);
}

function buildCrackPaths(allClicks, w, h) {
  const paths = [];
  allClicks.forEach(({cx, cy, stage}) => {
    const count = 4 + stage * 2;
    for (let i = 0; i < count; i++) {
      const s     = stage * 200 + i;
      const angle = rng(s) * Math.PI * 2;
      const len   = 20 + rng(s+1) * Math.max(w, h) * 0.6;
      const ex    = cx + Math.cos(angle) * len;
      const ey    = cy + Math.sin(angle) * len;
      const mx    = (cx+ex)/2 + (rng(s+2)-0.5)*28;
      const my    = (cy+ey)/2 + (rng(s+3)-0.5)*28;
      const op    = Math.min(0.85, 0.28 + stage * 0.15);
      const sw    = Math.max(0.4, 1.6 - stage * 0.22);
      paths.push(`<path d="M${cx},${cy} Q${mx},${my} ${ex},${ey}" stroke="rgba(255,255,255,${op.toFixed(2)})" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`);
      if (i < count * 0.5) {
        const ba = angle + (rng(s+4)-0.5)*1.3;
        const bl = len * 0.38;
        const bx = mx + Math.cos(ba)*bl;
        const by = my + Math.sin(ba)*bl;
        paths.push(`<path d="M${mx},${my} L${bx},${by}" stroke="rgba(255,255,255,${(op*0.7).toFixed(2)})" stroke-width="${(sw*0.7).toFixed(2)}" fill="none" stroke-linecap="round"/>`);
      }
    }
  });
  return paths.join('');
}

// ── BUILD CARDS ──────────────────────────────────────────
function buildCards(passwords) {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  clickHistory = {};

  if (!passwords || passwords.length === 0) {
    container.innerHTML = '<div class="status-msg">no passwords found</div>';
    return;
  }

  passwords.forEach((pw, idx) => {
    clickHistory[idx] = [];
    const dots = '•'.repeat(Math.min(pw.value.length, 20));
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-body">
        <div class="card-label">${pw.label}</div>
        <div class="card-pw" id="pw-text-${idx}">${dots}</div>
        <div class="copy-area" id="copy-${idx}">
          <button class="copy-btn" id="copybtn-${idx}">Copy</button>
          <span class="copy-tag">password revealed</span>
        </div>
      </div>
      <div class="glass" id="glass-${idx}" data-cracks="0">
        <div class="glass-frost"></div>
        <svg class="glass-svg" id="svg-${idx}" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>`;
    container.appendChild(card);

    document.getElementById(`copybtn-${idx}`).addEventListener('click', () => {
      navigator.clipboard.writeText(pw.value).then(() => {
        const btn = document.getElementById(`copybtn-${idx}`);
        btn.textContent = 'Copied!';
        btn.classList.add('ok');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
      });
    });

    document.getElementById(`glass-${idx}`).addEventListener('click', function(e) {
      if (!requireExcuse()) return;

      const history = clickHistory[idx];
      if (history.length >= MAX_CLICKS) return;

      const rect  = this.getBoundingClientRect();
      const cx    = e.clientX - rect.left;
      const cy    = e.clientY - rect.top;
      const w     = rect.width;
      const h     = rect.height;
      const stage = history.length + 1;

      history.push({cx, cy, stage});
      this.setAttribute('data-cracks', stage);
      document.getElementById(`svg-${idx}`).innerHTML = buildCrackPaths(history, w, h);

      this.classList.remove('hitting');
      void this.offsetWidth;
      this.classList.add('hitting');

      if (stage >= MAX_CLICKS) {
        const glassEl = this;
        setTimeout(() => {
          glassEl.classList.add('shattering');
          notify(pw.label);
          document.getElementById(`pw-text-${idx}`).textContent = pw.value;
          document.getElementById(`copy-${idx}`).classList.add('show');
          setTimeout(() => glassEl.remove(), 460);
        }, 80);
      }
    });
  });
}
